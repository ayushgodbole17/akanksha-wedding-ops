<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wedding Control Room</title>
<style>
  :root {
    --bg: #fbf5ee; --card: #ffffff; --line: #ead9cc; --ink: #3d2a2a; --muted: #7a6464;
    --accent: #5a1f2e; --accent-ink: #ffffff; --gold: #a87b3d;
    --warn-bg: #fdecea; --warn: #b3261e; --ok-bg: #e6f2ee; --ok: #1f6b54; --soft: #f4e9e1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1416; --card: #2a1f22; --line: #3e2f33; --ink: #f2e6e0; --muted: #b9a5a5;
      --accent: #e3a3b4; --accent-ink: #2a1016; --gold: #d8b07a;
      --warn-bg: #3d1f1f; --warn: #ffb4ab; --ok-bg: #1d3029; --ok: #8fd5b8; --soft: #33262a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header { padding: 16px 16px 8px; }
  header h1 { margin: 0; font-size: 1.25rem; color: var(--accent); }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  main { padding: 0 16px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 1.05rem; margin: 22px 0 8px; }
  h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); margin: 18px 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 8px; }
  .card .t { font-weight: 600; }
  .card .s { color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .row > div:not(.time) { min-width: 0; flex: 1; }
  .time { flex: none; width: 4.7em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; font-size: .9rem; padding-top: 1px; color: var(--accent); }
  .pill { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .warn-text { color: var(--warn); font-weight: 600; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .88rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  input[type=search], select, input[type=url] {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); margin: 4px 0 10px;
  }
  .stat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat button { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .stat .n { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .stat .warn .n { color: var(--warn); }
  .stat .good .n { color: var(--ok); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav[hidden] { display: none; }
  nav button { font: inherit; font-size: .78rem; background: none; border: 0; color: var(--muted); padding: 10px 2px 12px; cursor: pointer; }
  nav button span { display: block; font-size: 1.15rem; line-height: 1.2; }
  nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .foot { color: var(--muted); font-size: .8rem; text-align: center; margin: 24px 0 8px; }
  .foot button { font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; cursor: pointer; }
  .now { border-left: 4px solid var(--accent); }
  .setup p { margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>Akanksha &amp; Rishabh</h1>
  <p id="sub">Wedding control room</p>
</header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="now"><span>◷</span>Now</button>
  <button data-tab="arrivals"><span>⇣</span>Arrivals</button>
  <button data-tab="guests"><span>☺</span>Guests</button>
  <button data-tab="jobs"><span>✓</span>Jobs</button>
  <button data-tab="contacts"><span>☎</span>Contacts</button>
</nav>

<script>
"use strict";
// ------------------------------------------------------------------ config
const TABS = ["Guests", "Rooms", "Jobs", "Run sheet", "Contacts", "Vendors"];
const INVITE_LINK = "https://ayushgodbole17.github.io/rishabh-akanksha/godbole/";
const YEAR = 2026;
const store = {
  get(k) { try { return localStorage.getItem("wedding." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("wedding." + k, v); } catch {} },
};

// The sheet link travels in the page link (?sheet=ID), so no guest data or
// sheet address sits in the public repo. ?src=folder reads local CSVs (testing).
const params = new URLSearchParams(location.search);
if (params.get("sheet")) store.set("sheet", params.get("sheet"));
const SHEET = params.get("sheet") || store.get("sheet");
const LOCAL = params.get("src");

function tabUrl(name) {
  if (LOCAL) return `${LOCAL}/${encodeURIComponent(name)}.csv?t=${Date.now()}`;
  return `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
}

// ------------------------------------------------------------------ parsing
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows) {
  const head = (rows[0] || []).map(h => h.trim());
  return rows.slice(1)
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()]).filter(([h]) => h)))
    .filter(o => Object.values(o).some(v => v !== ""));
}
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseDate(s) {
  s = (s || "").trim().toLowerCase(); if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\s\-./]*([a-z]{3})[a-z]*[\s,\-./]*(\d{2,4})?/);
  if (m && MONTHS.includes(m[2])) return new Date(m[3] ? +(m[3].length === 2 ? "20" + m[3] : m[3]) : YEAR, MONTHS.indexOf(m[2]), +m[1]);
  m = s.match(/^(\d{1,2})[\-./](\d{1,2})(?:[\-./](\d{2,4}))?/);
  if (m) {
    let d = +m[1], mo = +m[2];
    if (mo > 12 && d <= 12) [d, mo] = [mo, d]; // month-first, e.g. 11/25/2026
    const y = m[3] ? +(m[3].length === 2 ? "20" + m[3] : m[3]) : YEAR;
    return new Date(y, mo - 1, d);
  }
  return null;
}
function parseTime(s) { // minutes after midnight
  s = (s || "").trim().toLowerCase(); if (!s) return null;
  if (/noon/.test(s)) return 12 * 60;
  const m = s.match(/^(\d{1,2})(?:[:.](\d{2}))?(?::\d{2})?\s*(am|pm|a\.m\.|p\.m\.)?/);
  if (!m) return null;
  let h = +m[1]; const min = +(m[2] || 0), ap = m[3] ? m[3][0] : "";
  if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0;
  return h * 60 + min;
}
const dayKey = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` : "";
const fmtDay = d => d ? d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }) : "Date not set";
const fmtTime = m => m == null ? "" : `${(Math.floor(m / 60) % 12) || 12}:${String(m % 60).padStart(2, "0")} ${m < 720 ? "AM" : "PM"}`;
const key = s => (s || "").toLowerCase().replace(/\s+/g, " ").trim();
const yes = s => /^y/i.test(s || "");

// ------------------------------------------------------------------ data
let D = null; // { guests, rooms, jobs, run, contacts, vendors, at }

async function load() {
  const texts = await Promise.all(TABS.map(async t => {
    const r = await fetch(tabUrl(t), { cache: "no-store" });
    if (!r.ok) throw new Error(`Couldn't read the "${t}" tab (${r.status}).`);
    const txt = await r.text();
    if (/^\s*</.test(txt)) throw new Error("The sheet isn't shared. In Google Sheets: Share → General access → Anyone with the link → Viewer.");
    return txt;
  }));
  const [guests, rooms, jobs, run, contacts, vendors] = texts.map(t => toObjects(parseCSV(t)));
  if (!guests.length || !("Name" in guests[0])) throw new Error('The "Guests" tab is missing or its headings were changed.');
  const data = { guests, rooms, jobs, run, contacts, vendors, at: Date.now() };
  store.set("cache", JSON.stringify(data));
  return data;
}

function derive(d) {
  const roomBy = Object.fromEntries(d.rooms.map(r => [key(r.Room), r]));
  const phones = {};
  for (const c of d.contacts) if (c.Phone) phones[key(c.Name)] = c.Phone;
  for (const v of d.vendors) if (v.Phone) { if (v["Contact person"]) phones[key(v["Contact person"])] = v.Phone; if (v["Vendor name"]) phones[key(v["Vendor name"])] = v.Phone; }
  for (const g of d.guests) if (g.Phone && !phones[key(g.Name)]) phones[key(g.Name)] = g.Phone;
  for (const g of d.guests) {
    g._room = roomBy[key(g.Room)] || null;
    g._arrDate = parseDate(g["Arrival date"]); g._arrTime = parseTime(g["Arrival time"]);
    g._depDate = parseDate(g["Departure date"]); g._depTime = parseTime(g["Departure time"]);
    g._needsPickup = yes(g["Pickup needed"]) && !g["Pickup by"];
  }
  for (const r of d.run) {
    r._date = parseDate(r.Date); r._start = parseTime(r.Start); r._end = parseTime(r.End);
  }
  d.run.sort((a, b) => (a._date - b._date) || ((a._start ?? -1) - (b._start ?? -1)));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (const j of d.jobs) {
    j._due = parseDate(j["Suggested deadline"] || j.Deadline);
    j._done = /^done/i.test(j.Status);
    j._late = !j._done && j._due && j._due < today;
  }
  d.phones = phones;
  d.people = [...new Set([...d.jobs.flatMap(j => [j.Owner, j.Helper]), ...d.run.map(r => r["In charge"]),
    ...d.guests.map(g => g["Pickup by"])].filter(Boolean).map(s => s.trim()))].sort();
  return d;
}

// ------------------------------------------------------------------ helpers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function digits(p) {
  let n = (p || "").replace(/\D/g, "");
  if (n.length === 10) n = "91" + n;
  return n;
}
function callBtns(phone, label) {
  const n = digits(phone); if (!n) return "";
  return `<a class="btn" href="tel:+${n}">Call${label ? " " + esc(label) : ""}</a><a class="btn" href="https://wa.me/${n}" target="_blank" rel="noopener">WhatsApp</a>`;
}
function personCall(name) {
  const p = D.phones[key(name)];
  return p ? callBtns(p, name.split(" ")[0]) : "";
}
function roomText(g) {
  if (!g._room) return g.Room ? `Room ${g.Room}` : "";
  const r = g._room, hotel = r.Hotel || "hotel not set";
  return `${hotel} · room ${r["Room number at hotel"] || r.Room}`;
}
function guestMessage(g) {
  const first = g.Name.split(" ")[0];
  const lines = [`Namaskar ${first}! Your details for Akanksha & Rishabh's wedding in Kalyan:`];
  if (g._room) {
    const r = g._room;
    lines.push(`Stay: ${r.Hotel || "hotel to be confirmed"}${r["Room number at hotel"] ? ", room " + r["Room number at hotel"] : ""}${r["Check-in"] ? ", check-in " + r["Check-in"] : ""}.`);
  }
  if (g._arrDate) {
    let s = `Arrival: ${fmtDay(g._arrDate)}${g._arrTime != null ? " " + fmtTime(g._arrTime) : ""}${g["Train / flight no"] ? ", " + g["Train / flight no"] : ""}.`;
    if (g["Pickup by"]) {
      const p = D.phones[key(g["Pickup by"])];
      s += ` ${g["Pickup by"]} will pick you up${g["Arrives at"] ? " at " + g["Arrives at"] : ""}${p ? " (" + p + ")" : ""}.`;
    }
    lines.push(s);
  }
  lines.push(`Full schedule and venues: ${INVITE_LINK}`);
  return lines.join("\n");
}
function chips(name, options, current) {
  return `<div class="chips">${options.map(([v, label]) =>
    `<button class="chip" data-chip="${name}" data-v="${v}" aria-pressed="${v === current}">${esc(label)}</button>`).join("")}</div>`;
}

// ------------------------------------------------------------------ views
const state = { tab: (views => views.includes(params.get("tab")) ? params.get("tab") : null)(["now", "arrivals", "guests", "jobs", "contacts"]) || store.get("tab") || "now", arr: "in", gview: "people", gfilter: "all", q: "", me: store.get("me") || "" };

const views = {
  now() {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), today = dayKey(now);
    const muhurat = new Date(YEAR, 10, 26, 9, 15);
    const days = Math.ceil((muhurat - now) / 864e5);
    let h = "";
    if (days > 0) h += `<div class="card"><div class="t">${days} day${days === 1 ? "" : "s"} to the muhurat</div><div class="s">26 Nov, 9:15 AM · Nakshatra Banquet Hall, Kalyan</div></div>`;

    const todays = D.run.filter(r => dayKey(r._date) === today);
    if (todays.length) {
      const live = todays.filter(r => r._start != null && r._start <= mins && mins < (r._end ?? r._start + 60));
      const next = todays.filter(r => r._start != null && r._start > mins).slice(0, 3);
      h += `<h2>Happening now</h2>` + (live.length ? live.map(r => runCard(r, true)).join("") : `<div class="empty">Nothing scheduled right now.</div>`);
      h += `<h2>Up next today</h2>` + (next.length ? next.map(r => runCard(r)).join("") : `<div class="empty">Nothing more today.</div>`);
    }

    const noRoom = D.guests.filter(g => !g._room && !/own stay|day visit/i.test(g.Notes)).length;
    const pickups = D.guests.filter(g => g._needsPickup).length;
    const noTravel = D.guests.filter(g => !g._arrDate && !/day visit|own/i.test(g.Notes)).length;
    const late = D.jobs.filter(j => j._late).length;
    const unowned = D.jobs.filter(j => !j.Owner && !j._done).length;
    const done = D.jobs.filter(j => j._done).length;
    const tile = (n, label, go, goodWhenZero = true) =>
      `<button class="card ${n ? "warn" : goodWhenZero ? "good" : ""}" data-go="${go}"><div class="n">${n}</div><div class="s">${label}</div></button>`;
    h += `<h2>Needs attention</h2><div class="stat">
      ${tile(late, "jobs past their deadline", "jobs:late")}
      ${tile(unowned, "jobs with nobody in charge", "jobs:unowned")}
      ${tile(noRoom, "guests without a room", "guests:noroom")}
      ${tile(pickups, "arrivals with no pickup", "arrivals:pickup")}
      ${tile(noTravel, "guests with no travel details", "arrivals:missing")}
      <div class="card good"><div class="n">${done}/${D.jobs.length}</div><div class="s">jobs done</div></div>
    </div>`;

    h += `<h2>Full schedule</h2>`;
    let last = null;
    for (const r of D.run) {
      const k = dayKey(r._date);
      if (k !== last) { h += `<h3>${fmtDay(r._date)}</h3>`; last = k; }
      h += runCard(r);
    }
    return h;
  },

  arrivals() {
    const f = state.arr;
    let h = chips("arr", [["in", "Arrivals"], ["out", "Departures"], ["pickup", "No pickup yet"], ["missing", "No details"]], f);
    if (f === "missing") {
      const list = D.guests.filter(g => !g._arrDate).sort((a, b) => a["List in old sheet"].localeCompare(b["List in old sheet"]) || a.Name.localeCompare(b.Name));
      h += `<p class="s">${list.length} people have no arrival date yet. Fill in the Guests tab of the sheet.</p>`;
      let last = null;
      for (const g of list) {
        const grp = g["List in old sheet"] || "Other";
        if (grp !== last) { h += `<h3>${esc(grp)}</h3>`; last = grp; }
        h += `<div class="card"><div class="row"><div><div class="t">${esc(g.Name)}</div><div class="s">${esc([g["Travel mode"], g["Coming from"]].filter(Boolean).join(" from ") || "Travel not known")}</div></div></div>${g.Phone ? `<div class="actions">${callBtns(g.Phone)}</div>` : ""}</div>`;
      }
      return h;
    }
    const out = f === "out";
    let list = D.guests.filter(g => out ? g._depDate : g._arrDate);
    if (f === "pickup") list = list.filter(g => g._needsPickup);
    // people on the same train/flight at the same time travel as one party
    const parties = new Map();
    for (const g of list) {
      const d = out ? g._depDate : g._arrDate, t = out ? g._depTime : g._arrTime;
      const no = out ? g["Departure train / flight"] : g["Train / flight no"];
      const k = [dayKey(d), t, key(no), out ? "" : key(g["Pickup by"])].join("|");
      if (!parties.has(k)) parties.set(k, { d, t, no, at: g["Arrives at"], by: g["Pickup by"], people: [] });
      parties.get(k).people.push(g);
    }
    const sorted = [...parties.values()].sort((a, b) => (a.d - b.d) || ((a.t ?? 9999) - (b.t ?? 9999)));
    if (!sorted.length) return h + `<div class="empty">${f === "pickup" ? "Every arrival that needs a pickup has someone assigned." : "No dates filled in yet. Add them in the Guests tab."}</div>`;
    let last = null;
    for (const p of sorted) {
      const k = dayKey(p.d);
      if (k !== last) { h += `<h3>${fmtDay(p.d)}</h3>`; last = k; }
      const need = p.people.some(g => g._needsPickup);
      const pick = out ? "" : p.by ? `<div class="s">Pickup: <b>${esc(p.by)}</b></div>` : need ? `<div class="warn-text">No pickup assigned</div>` : "";
      h += `<div class="card"><div class="row"><div class="time">${esc(fmtTime(p.t) || "—")}</div><div>
        <div class="t">${p.people.map(g => esc(g.Name)).join(", ")}</div>
        <div class="s">${esc([p.no, out ? "" : p.at].filter(Boolean).join(" · ") || "Train/flight not set")} · ${p.people.length} ${p.people.length === 1 ? "person" : "people"}</div>
        ${pick}</div></div>
        <div class="actions">${p.by ? personCall(p.by) : ""}${p.people.filter(g => g.Phone).slice(0, 1).map(g => callBtns(g.Phone, g.Name.split(" ")[0])).join("")}</div></div>`;
    }
    return h;
  },

  guests() {
    let h = chips("gview", [["people", "People"], ["rooms", "Rooms"]], state.gview);
    h += `<input type="search" id="q" placeholder="Search a name, room or hotel" value="${esc(state.q)}" autocomplete="off">`;
    const q = key(state.q);
    if (state.gview === "rooms") {
      const byHotel = new Map();
      for (const r of D.rooms) {
        const people = D.guests.filter(g => key(g.Room) === key(r.Room));
        const names = people.length ? people.map(g => g.Name) : (r.People || "").split(",").map(s => s.trim()).filter(Boolean);
        if (q && !key([r.Room, r.Hotel, r["Room number at hotel"], ...names].join(" ")).includes(q)) continue;
        const hk = r.Hotel || "Hotel not set";
        if (!byHotel.has(hk)) byHotel.set(hk, []);
        byHotel.get(hk).push({ r, names });
      }
      for (const [hotel, rooms] of byHotel) {
        h += `<h3>${esc(hotel)} · ${rooms.length} rooms</h3>`;
        for (const { r, names } of rooms)
          h += `<div class="card"><div class="row"><div><div class="t">${esc(r["Room number at hotel"] ? "Room " + r["Room number at hotel"] : r.Room)}</div><div class="s">${esc(names.join(", ") || "Empty")}</div></div><span class="pill">${esc(r.Room)}</span></div>${r.Notes ? `<div class="s">${esc(r.Notes)}</div>` : ""}</div>`;
      }
      return h + (byHotel.size ? "" : `<div class="empty">No rooms match.</div>`);
    }
    h += chips("gfilter", [["all", `All (${D.guests.length})`], ["noroom", "No room"], ["notlisted", "Not on invite list"], ["pickup", "Needs pickup"]], state.gfilter);
    let list = D.guests;
    if (state.gfilter === "noroom") list = list.filter(g => !g._room);
    if (state.gfilter === "notlisted") list = list.filter(g => /not on invite/i.test(g["List in old sheet"]));
    if (state.gfilter === "pickup") list = list.filter(g => g._needsPickup);
    if (q) list = list.filter(g => key([g.Name, g.Room, g._room?.Hotel, g["Coming from"]].join(" ")).includes(q));
    list = [...list].sort((a, b) => a.Name.localeCompare(b.Name));
    h += `<p class="s">${list.length} shown</p>`;
    for (const g of list.slice(0, 200)) {
      const travel = g._arrDate ? `Arrives ${fmtDay(g._arrDate)} ${fmtTime(g._arrTime)} ${g["Train / flight no"] || ""}` : [g["Travel mode"], g["Coming from"]].filter(Boolean).join(" from ");
      h += `<div class="card"><div class="row"><div><div class="t">${esc(g.Name)}</div>
        <div class="s">${roomText(g) ? esc(roomText(g)) : `<span class="warn-text">No room</span>`}</div>
        ${travel ? `<div class="s">${esc(travel)}</div>` : ""}
        ${g["Pickup by"] ? `<div class="s">Pickup: ${esc(g["Pickup by"])}</div>` : g._needsPickup ? `<div class="warn-text">Needs pickup</div>` : ""}
        ${g.Notes ? `<div class="s">${esc(g.Notes)}</div>` : ""}</div>
        ${g.Room ? `<span class="pill">${esc(g.Room)}</span>` : ""}</div>
        <div class="actions">${callBtns(g.Phone)}<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${digits(g.Phone)}?text=${encodeURIComponent(guestMessage(g))}">Send their details</a></div></div>`;
    }
    return h;
  },

  jobs() {
    const opts = [["", "Everyone"], ["late", "Past deadline"], ["unowned", "Nobody in charge"], ...D.people.map(p => [p, p])];
    let h = `<label class="s" for="me">Show jobs for</label><select id="me">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === state.me ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    const me = state.me, person = me && me !== "late" && me !== "unowned";
    let jobs = D.jobs;
    if (me === "late") jobs = jobs.filter(j => j._late);
    else if (me === "unowned") jobs = jobs.filter(j => !j.Owner && !j._done);
    else if (person) jobs = jobs.filter(j => key(j.Owner) === key(me) || key(j.Helper) === key(me));

    if (person) {
      const slots = D.run.filter(r => key(r["In charge"]) === key(me));
      const picks = D.guests.filter(g => key(g["Pickup by"]) === key(me)).sort((a, b) => (a._arrDate - b._arrDate) || (a._arrTime - b._arrTime));
      if (slots.length) h += `<h2>Your slots on the day</h2>` + slots.map(r => runCard(r)).join("");
      if (picks.length) h += `<h2>Your pickups</h2>` + picks.map(g => `<div class="card"><div class="row"><div class="time">${esc(fmtTime(g._arrTime) || "—")}</div><div><div class="t">${esc(g.Name)}</div><div class="s">${esc([fmtDay(g._arrDate), g["Train / flight no"], g["Arrives at"]].filter(Boolean).join(" · "))}</div></div></div><div class="actions">${callBtns(g.Phone)}</div></div>`).join("");
      h += `<h2>Your jobs</h2>`;
    }
    if (!jobs.length) return h + `<div class="empty">No jobs here.</div>`;
    let last = null;
    for (const j of jobs) {
      if (j.Area !== last) { h += `<h3>${esc(j.Area || "Other")}</h3>`; last = j.Area; }
      const status = j._done ? `<span class="pill ok">Done</span>` : /stuck/i.test(j.Status) ? `<span class="pill warn">Stuck</span>` : `<span class="pill">${esc(j.Status || "Not started")}</span>`;
      h += `<div class="card"><div class="row"><div><div class="t">${esc(j.Job)}</div>
        <div class="s">${[j.When ? esc(j.When) : "", j._due ? `due <span class="${j._late ? "warn-text" : ""}">${esc(fmtDay(j._due))}</span>` : ""].filter(Boolean).join(" · ")}</div>
        <div class="s">${j.Owner ? "In charge: <b>" + esc(j.Owner) + "</b>" : `<span class="warn-text">Nobody in charge</span>`}${j.Helper ? " · helper " + esc(j.Helper) : ""}</div>
        ${j.Notes ? `<div class="s">${esc(j.Notes)}</div>` : ""}</div>${status}</div>
        ${j.Owner ? `<div class="actions">${personCall(j.Owner)}</div>` : ""}</div>`;
    }
    return h;
  },

  contacts() {
    let h = `<h2>Family and coordinators</h2>`;
    h += D.contacts.map(c => `<div class="card"><div class="t">${esc(c.Name)}</div><div class="s">${esc([c.Role, c.Side].filter(Boolean).join(" · "))}</div>${c.Phone ? `<div class="actions">${callBtns(c.Phone)}</div>` : `<div class="s warn-text">No phone number in the sheet</div>`}</div>`).join("");
    h += `<h2>Venues and vendors</h2>`;
    h += D.vendors.map(v => {
      const name = v["Vendor name"] || "Not booked yet";
      const booked = yes(v.Booked) ? `<span class="pill ok">Booked</span>` : v["Vendor name"] ? `<span class="pill">${esc(v.Booked || "Not confirmed")}</span>` : `<span class="pill warn">Open</span>`;
      const map = v.Address ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ", " + v.Address)}">Map</a>` : "";
      return `<div class="card"><div class="row"><div><div class="t">${esc(v.Category)}: ${esc(name)}</div>
        <div class="s">${esc([v.For, v["Contact person"], v["Point person"] ? "our side: " + v["Point person"] : ""].filter(Boolean).join(" · "))}</div>
        ${v.Address ? `<div class="s">${esc(v.Address)}</div>` : ""}</div>${booked}</div>
        <div class="actions">${callBtns(v.Phone)}${map}</div></div>`;
    }).join("");
    return h;
  },
};

function runCard(r, live) {
  const t = r._start != null ? fmtTime(r._start) + (r._end != null ? "–" + fmtTime(r._end) : " onwards")
    : r._end != null ? "Until " + fmtTime(r._end) : "All day";
  return `<div class="card ${live ? "now" : ""}"><div class="row"><div class="time">${esc(fmtTime(r._start) || "—")}</div><div>
    <div class="t">${esc(r.What)}</div><div class="s">${esc(t)} · ${esc(r.Where || "")}</div>
    <div class="s">${r["In charge"] ? "In charge: <b>" + esc(r["In charge"]) + "</b>" : `<span class="warn-text">Nobody in charge</span>`}${/suggest/i.test(r.Source) ? " · suggested" : ""}</div>
    ${r.Notes ? `<div class="s">${esc(r.Notes)}</div>` : ""}</div></div>
    ${r["In charge"] ? `<div class="actions">${personCall(r["In charge"])}</div>` : ""}</div>`;
}

// ------------------------------------------------------------------ render
const view = document.getElementById("view"), nav = document.getElementById("nav"), sub = document.getElementById("sub");

function render() {
  if (!D) return;
  nav.hidden = false;
  for (const b of nav.querySelectorAll("button")) b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false");
  const at = new Date(D.at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
  view.innerHTML = views[state.tab]() + `<div class="foot">From the sheet at ${at} · <button id="refresh">Refresh</button></div>`;
  const q = document.getElementById("q");
  if (q && state.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

nav.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; store.set("tab", state.tab); state.focusQ = false; render(); scrollTo(0, 0);
});
view.addEventListener("click", e => {
  const c = e.target.closest("[data-chip]");
  if (c) { state[c.dataset.chip] = c.dataset.v; state.focusQ = false; render(); return; }
  const g = e.target.closest("[data-go]");
  if (g) {
    const [tab, f] = g.dataset.go.split(":");
    state.tab = tab;
    if (tab === "jobs") state.me = f;
    if (tab === "guests") { state.gview = "people"; state.gfilter = f; }
    if (tab === "arrivals") state.arr = f;
    render(); scrollTo(0, 0); return;
  }
  if (e.target.id === "refresh") refresh();
});
view.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; state.focusQ = true; render(); }
});
view.addEventListener("change", e => {
  if (e.target.id === "me") { state.me = e.target.value; store.set("me", state.me); render(); }
});

async function refresh() {
  try {
    D = derive(await load());
    sub.textContent = "Wedding control room";
    render();
  } catch (err) {
    if (!D) {
      try { const c = JSON.parse(store.get("cache") || "null"); if (c) { D = derive(c); render(); } } catch {}
    }
    sub.textContent = D ? "Offline: showing the last saved copy" : "Couldn't load the sheet";
    if (!D) view.innerHTML = `<div class="card setup"><p class="warn-text">${esc(err.message)}</p><p>Check your internet and try again.</p><button class="btn primary" id="refresh">Try again</button></div>`;
  }
}

function setup() {
  view.innerHTML = `<div class="card setup">
    <p><b>Open this page from the link you were sent.</b> It carries the sheet address.</p>
    <p class="s">Setting up? Paste the Google Sheet's link (shared as "Anyone with the link → Viewer"):</p>
    <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…">
    <button class="btn primary" id="go">Open</button></div>`;
  document.getElementById("go").onclick = () => {
    const m = document.getElementById("sheetUrl").value.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
    if (!m) { document.getElementById("sheetUrl").insertAdjacentHTML("afterend", `<p class="warn-text">That doesn't look like a Google Sheets link.</p>`); return; }
    location.search = "?sheet=" + m[1];
  };
}

if (!SHEET && !LOCAL) setup();
else {
  view.innerHTML = `<div class="empty">Loading…</div>`;
  refresh();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 120000);
}
</script>
</body>
</html>
