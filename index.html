<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wedding Control Room</title>
<meta name="theme-color" content="#0B4F4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap">
<style>
  /* Colours taken from a Paithani saree: peacock body, zari gold, magenta edge.
     Kumkum red marks what needs attention, haldi yellow marks what is on now. */
  :root {
    --paper: #fbfbf8; --raised: #ffffff; --ink: #17211f; --muted: #55625e; --line: #dce3e0; --soft: #edf2f0;
    --peacock: #0b4f4a; --on-peacock: #ffffff; --gold-on-peacock: #eac46c;
    --accent: #0b4f4a; --on-accent: #ffffff;
    --gold: #c9972b; --magenta: #9e1f5c;
    --red: #b0102e; --red-bg: #fbe8ec; --ok: #1c6b3a; --ok-bg: #e4f1e8;
    --haldi: #f2b705; --haldi-bg: #fff5d1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d1917; --raised: #13221f; --ink: #e6eeeb; --muted: #9aada7; --line: #22332f; --soft: #1a2b28;
      --peacock: #0a3f3b; --accent: #62c6b7; --on-accent: #08201d;
      --gold: #d4a94a; --magenta: #c24a82;
      --red: #ff8fa0; --red-bg: #3a1720; --ok: #86d6a2; --ok-bg: #14301f;
      --haldi-bg: #2c2610;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 "Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  header { background: var(--peacock); color: var(--on-peacock); padding: calc(20px + env(safe-area-inset-top)) 16px 14px; }
  header > * { max-width: 640px; margin-left: auto; margin-right: auto; }
  header h1 { margin: 0; font: 400 2rem/1.15 "Yatra One", "Mukta", serif; }
  #count { margin-top: 6px; margin-bottom: 0; color: var(--gold-on-peacock); font-weight: 600; }
  #count:empty { display: none; }
  #sub { margin-top: 2px; margin-bottom: 0; color: rgba(255, 255, 255, .82); font-size: .95rem; }
  /* the woven border: gold thread, a row of temple triangles, magenta edge */
  .zari {
    height: 16px;
    background:
      linear-gradient(var(--gold), var(--gold)) top / 100% 2px no-repeat,
      linear-gradient(var(--magenta), var(--magenta)) bottom / 100% 4px no-repeat,
      conic-gradient(from 135deg at 50% 0, var(--gold) 90deg, transparent 0) 0 3px / 16px 8px repeat-x,
      var(--peacock);
  }

  main { padding: 4px 16px 0; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 1.1rem; font-weight: 700; margin: 26px 0 6px; }
  h3 { font: 400 1.15rem/1.3 "Yatra One", "Mukta", serif; color: var(--accent); margin: 22px 0 4px; }
  .h-n { font: 400 .9rem "Mukta", sans-serif; color: var(--muted); margin-left: 6px; }
  p.s { margin: 4px 0; }
  .s { color: var(--muted); font-size: .92rem; }
  .warn-text { color: var(--red); font-weight: 600; }
  .empty { color: var(--muted); padding: 10px 0; }

  /* lists are plain rows, not boxes */
  .card { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .t { font-weight: 600; line-height: 1.35; }
  .row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .row > div:not(.time) { min-width: 0; flex: 1; }
  .time { flex: none; width: 4.8em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; font-size: .95rem; line-height: 1.4; color: var(--accent); }
  .time small { display: block; font-weight: 400; font-size: .82rem; color: var(--muted); white-space: normal; }
  .pill { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .pill.warn { background: var(--red-bg); color: var(--red); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }

  /* the schedule is a sequence, so it gets a rail */
  .ev { display: grid; grid-template-columns: 4.8em minmax(0, 1fr); column-gap: 12px; }
  .ev .time { width: auto; }
  .ev .body { position: relative; border-left: 2px solid var(--gold); padding: 0 0 22px 18px; }
  .ev .body::before {
    content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--gold);
  }
  .ev.live .body::before { background: var(--haldi); border-color: var(--haldi); box-shadow: 0 0 0 4px var(--haldi-bg); }
  .ev .actions { margin-top: 8px; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--ink);
    font: inherit; font-size: .92rem; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 40px; border: 1px solid var(--line); background: var(--raised); color: var(--ink);
    border-radius: 99px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  input[type=search], select, input[type=url] {
    width: 100%; min-height: 46px; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raised); color: var(--ink); margin: 4px 0 10px;
  }
  label.s { display: block; margin-top: 14px; }

  /* needs-attention list */
  .attn { border-top: 1px solid var(--line); }
  .att {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 10px 2px;
    border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left;
  }
  button.att { cursor: pointer; }
  button.att::after {
    content: ""; flex: none; width: 8px; height: 8px; margin-right: 8px;
    border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: rotate(45deg);
  }
  .att .n { flex: none; min-width: 2.8em; font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .att .l { flex: 1; }
  .att.bad .n { color: var(--red); }
  .att.good .n { color: var(--ok); }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--raised); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav[hidden] { display: none; }
  nav button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px;
    font: inherit; font-size: .78rem; background: none; border: 0; color: var(--muted); padding: 9px 2px; cursor: pointer;
  }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  nav button[aria-current="page"]::before {
    content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold);
  }
  .foot { color: var(--muted); font-size: .85rem; text-align: center; margin: 28px 0 8px; }
  .foot button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 8px; }
  .setup { padding: 16px; margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); }
  .setup p { margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>Akanksha &amp; Rishabh</h1>
  <p id="sub">Wedding control room</p>
  <p id="count"></p>
</header>
<div class="zari" aria-hidden="true"></div>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedule</button>
  <button data-tab="rooms"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14M3 14h18M7 14v-3a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v3M3 20h18"/></svg>Rooms</button>
  <button data-tab="drivers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 19v2M17 19v2M5 11h14"/><circle cx="7.5" cy="13.5" r=".5"/><circle cx="16.5" cy="13.5" r=".5"/></svg>Drivers</button>
  <button data-tab="contacts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>Contacts</button>
  <button data-tab="places"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Places</button>
</nav>

<script>
"use strict";
// ------------------------------------------------------------------ config
// The page is information only: schedule, rooms, drivers, contacts and places.
const TABS = ["Guests", "Rooms", "Run sheet", "Contacts", "Vendors"];
const YEAR = 2026;
const store = {
  get(k) { try { return localStorage.getItem("wedding." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("wedding." + k, v); } catch {} },
};

// The sheet link travels in the page link (?sheet=ID), so no guest data or
// sheet address sits in the public repo. ?src=folder reads local CSVs (testing).
const params = new URLSearchParams(location.search);
if (params.get("sheet")) store.set("sheet", params.get("sheet"));
const SHEET = params.get("sheet") || store.get("sheet");
const LOCAL = params.get("src");

function tabUrl(name) {
  if (LOCAL) return `${LOCAL}/${encodeURIComponent(name)}.csv?t=${Date.now()}`;
  return `https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
}

// ------------------------------------------------------------------ parsing
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows) {
  const head = (rows[0] || []).map(h => h.trim());
  return rows.slice(1)
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()]).filter(([h]) => h)))
    .filter(o => Object.values(o).some(v => v !== ""));
}
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseDate(s) {
  s = (s || "").trim().toLowerCase(); if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\s\-./]*([a-z]{3})[a-z]*[\s,\-./]*(\d{2,4})?/);
  if (m && MONTHS.includes(m[2])) return new Date(m[3] ? +(m[3].length === 2 ? "20" + m[3] : m[3]) : YEAR, MONTHS.indexOf(m[2]), +m[1]);
  m = s.match(/^(\d{1,2})[\-./](\d{1,2})(?:[\-./](\d{2,4}))?/);
  if (m) {
    let d = +m[1], mo = +m[2];
    if (mo > 12 && d <= 12) [d, mo] = [mo, d]; // month-first, e.g. 11/25/2026
    const y = m[3] ? +(m[3].length === 2 ? "20" + m[3] : m[3]) : YEAR;
    return new Date(y, mo - 1, d);
  }
  return null;
}
function parseTime(s) { // minutes after midnight
  s = (s || "").trim().toLowerCase(); if (!s) return null;
  if (/noon/.test(s)) return 12 * 60;
  const m = s.match(/^(\d{1,2})(?:[:.](\d{2}))?(?::\d{2})?\s*(am|pm|a\.m\.|p\.m\.)?/);
  if (!m) return null;
  let h = +m[1]; const min = +(m[2] || 0), ap = m[3] ? m[3][0] : "";
  if (ap === "p" && h < 12) h += 12; if (ap === "a" && h === 12) h = 0;
  return h * 60 + min;
}
const dayKey = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` : "";
const fmtDay = d => d ? d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }) : "Date not set";
const fmtTime = m => m == null ? "" : `${(Math.floor(m / 60) % 12) || 12}:${String(m % 60).padStart(2, "0")} ${m < 720 ? "AM" : "PM"}`;
const key = s => (s || "").toLowerCase().replace(/\s+/g, " ").trim();
const yes = s => /^y/i.test(s || "");
const isDriver = c => /taxi|driver/i.test(`${c.Role} ${c.Notes}`);

// ------------------------------------------------------------------ data
let D = null; // { guests, rooms, run, contacts, vendors, at }

async function load() {
  const texts = await Promise.all(TABS.map(async t => {
    const r = await fetch(tabUrl(t), { cache: "no-store" });
    if (!r.ok) throw new Error(`Couldn't read the "${t}" tab (${r.status}).`);
    const txt = await r.text();
    if (/^\s*</.test(txt)) throw new Error("The sheet isn't shared. In Google Sheets: Share → General access → Anyone with the link → Viewer.");
    return txt;
  }));
  const [guests, rooms, run, contacts, vendors] = texts.map(t => toObjects(parseCSV(t)));
  if (!guests.length || !("Name" in guests[0])) throw new Error('The "Guests" tab is missing or its headings were changed.');
  const data = { guests, rooms, run, contacts, vendors, at: Date.now() };
  store.set("cache", JSON.stringify(data));
  return data;
}

function derive(d) {
  const phones = {};
  for (const c of d.contacts) if (c.Phone) phones[key(c.Name)] = c.Phone;
  for (const v of d.vendors || []) if (v.Phone) { if (v["Contact person"]) phones[key(v["Contact person"])] = v.Phone; if (v["Vendor name"]) phones[key(v["Vendor name"])] = v.Phone; }
  for (const r of d.run) {
    r._date = parseDate(r.Date); r._start = parseTime(r.Start); r._end = parseTime(r.End);
  }
  d.run.sort((a, b) => (a._date - b._date) || ((a._start ?? -1) - (b._start ?? -1)));
  d.vendors = d.vendors || [];
  d.phones = phones;
  return d;
}

// ------------------------------------------------------------------ helpers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function digits(p) {
  let n = (p || "").replace(/\D/g, "");
  if (n.length === 10) n = "91" + n;
  return n;
}
function callBtns(phone, label) {
  const n = digits(phone); if (!n) return "";
  return `<a class="btn" href="tel:+${n}">Call${label ? " " + esc(label) : ""}</a><a class="btn" href="https://wa.me/${n}" target="_blank" rel="noopener">WhatsApp</a>`;
}
function personCall(name) {
  const p = D.phones[key(name)];
  return p ? callBtns(p, name.replace(/\s*\(.*\)\s*/g, "").split(" ")[0]) : "";
}
function mapBtn(name, address) {
  if (!address) return "";
  return `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((name ? name + ", " : "") + address)}">Map</a>`;
}
function chips(name, options, current) {
  return `<div class="chips">${options.map(([v, label]) =>
    `<button class="chip" data-chip="${name}" data-v="${v}" aria-pressed="${v === current}">${esc(label)}</button>`).join("")}</div>`;
}
const hasNumber = s => /\d/.test(s || "");

// ------------------------------------------------------------------ views
const TAB_NAMES = ["schedule", "rooms", "drivers", "contacts", "places"];
const pickTab = t => TAB_NAMES.includes(t) ? t : t === "now" ? "schedule" : t === "guests" ? "rooms" : null;
const state = { tab: pickTab(params.get("tab")) || pickTab(store.get("tab")) || "schedule", q: "" };

const views = {
  schedule() {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), today = dayKey(now);
    let h = "";
    const todays = D.run.filter(r => dayKey(r._date) === today);
    if (todays.length) {
      const live = todays.filter(r => r._start != null && r._start <= mins && mins < (r._end ?? r._start + 60));
      const next = todays.filter(r => r._start != null && r._start > mins).slice(0, 3);
      if (live.length) h += `<h2>Happening now</h2>` + live.map(r => runCard(r, true)).join("");
      if (next.length) h += `<h2>Up next today</h2>` + next.map(r => runCard(r)).join("");
    }
    h += `<h2>Full schedule</h2>`;
    let last = null;
    for (const r of D.run) {
      const k = dayKey(r._date);
      if (k !== last) { h += `<h3>${fmtDay(r._date)}</h3>`; last = k; }
      h += runCard(r);
    }
    return h;
  },

  rooms() {
    let h = `<input type="search" id="q" placeholder="Search your name, room or hotel" value="${esc(state.q)}" autocomplete="off">`;
    const q = key(state.q);
    const hotels = new Map();
    for (const r of D.rooms) {
      const people = D.guests.filter(g => key(g.Room) === key(r.Room)).map(g => g.Name);
      const raw = people.length ? people : (r.People || "").split(",").map(s => s.trim()).filter(Boolean);
      const counts = new Map(); for (const n of raw) counts.set(n, (counts.get(n) || 0) + 1);
      const names = [...counts].map(([n, c]) => c > 1 ? `${n} ×${c}` : n);
      if (!names.length && !q) continue; // skip empty rooms
      if (q && !key([r.Hotel, r["Room number at hotel"], ...names].join(" ")).includes(q)) continue;
      const hk = r.Hotel || "Hotel not set";
      if (!hotels.has(hk)) hotels.set(hk, []);
      hotels.get(hk).push({ r, names });
    }
    for (const [hotel, rooms] of hotels) {
      const v = D.vendors.find(v => key(v["Vendor name"]) === key(hotel));
      h += `<h3>${esc(hotel)}<span class="h-n">${rooms.length} rooms</span></h3>`;
      if (v) {
        const note = v.Notes ? `<div class="s">${esc(v.Notes)}</div>` : "";
        h += `${v.Address ? `<div class="s">${esc(v.Address)}</div>` : ""}${note}<div class="actions">${mapBtn(hotel, v.Address)}${v["Point person"] ? personCall(v["Point person"]) : ""}</div>`;
      }
      for (const { r, names } of rooms) {
        const no = r["Room number at hotel"];
        h += `<div class="card"><div class="t">${hasNumber(no) ? "Room " + esc(no) : "Room number to come"}</div><div class="s">${esc(names.join(", ") || "Empty")}</div></div>`;
      }
    }
    return h + (hotels.size ? "" : `<div class="empty">No rooms match.</div>`);
  },

  drivers() {
    const list = D.contacts.filter(isDriver);
    if (!list.length) return `<div class="empty">No drivers in the sheet yet.</div>`;
    let h = `<h2>Taxis</h2>`;
    for (const c of list) {
      const name = c.Name.replace(/\s*\((taxi|driver)\)\s*/i, "");
      const car = (c.Role || "").replace(/^taxi driver\s*[-–:]?\s*/i, "");
      h += `<div class="card"><div class="row"><div><div class="t">${esc(name)}</div>${car ? `<div class="s">${esc(car)}</div>` : ""}</div></div>${c.Phone ? `<div class="actions">${callBtns(c.Phone)}</div>` : ""}</div>`;
    }
    return h;
  },

  contacts() {
    const list = D.contacts.filter(c => !isDriver(c));
    let h = `<h2>Family and coordinators</h2>`;
    h += list.map(c => `<div class="card"><div class="t">${esc(c.Name)}</div><div class="s">${esc(c.Role || "")}</div>${c.Phone ? `<div class="actions">${callBtns(c.Phone)}</div>` : ""}</div>`).join("");
    return h;
  },

  places() {
    const list = D.vendors.filter(v => v["Vendor name"] && v.Address);
    const order = c => /venue/i.test(c) ? 0 : /hotel/i.test(c) ? 1 : 2;
    list.sort((a, b) => order(a.Category) - order(b.Category));
    if (!list.length) return `<div class="empty">No places in the sheet yet.</div>`;
    let h = "", last = null;
    for (const v of list) {
      const grp = /venue/i.test(v.Category) ? "Venues" : /hotel/i.test(v.Category) ? "Hotels" : "Other";
      if (grp !== last) { h += `<h2>${grp}</h2>`; last = grp; }
      h += `<div class="card"><div class="t">${esc(v["Vendor name"])}</div>
        <div class="s">${esc(v.For || "")}</div>
        <div class="s">${esc(v.Address)}</div>
        <div class="actions">${mapBtn(v["Vendor name"], v.Address)}${callBtns(v.Phone)}</div></div>`;
    }
    return h;
  },
};

function runCard(r, live) {
  const until = r._end != null ? "until " + fmtTime(r._end) : "";
  const where = [r.Where, until].filter(Boolean).join(", ");
  return `<div class="ev${live ? " live" : ""}"><div class="time">${esc(fmtTime(r._start) || "All day")}</div><div class="body">
    <div class="t">${esc(r.What)}</div>${where ? `<div class="s">${esc(where[0].toUpperCase() + where.slice(1))}</div>` : ""}
    ${r["In charge"] ? `<div class="s">In charge: <b>${esc(r["In charge"])}</b></div>` : ""}
    ${r.Notes ? `<div class="s">${esc(r.Notes)}</div>` : ""}
    ${r["In charge"] ? `<div class="actions">${personCall(r["In charge"])}</div>` : ""}</div></div>`;
}

// ------------------------------------------------------------------ render
const view = document.getElementById("view"), nav = document.getElementById("nav"), sub = document.getElementById("sub");
function countdown() {
  const days = Math.ceil((new Date(YEAR, 10, 26, 9, 15) - new Date()) / 864e5);
  document.getElementById("count").textContent = days > 0 ? `${days} day${days === 1 ? "" : "s"} to the muhurat, 26 Nov at 9:15 AM` : "";
}
countdown();

function render() {
  if (!D) return;
  nav.hidden = false;
  for (const b of nav.querySelectorAll("button")) b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false");
  const at = new Date(D.at).toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
  countdown();
  view.innerHTML = views[state.tab]() + `<div class="foot">Updated from the sheet at ${at}. <button id="refresh">Refresh</button></div>`;
  const q = document.getElementById("q");
  if (q && state.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

nav.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; store.set("tab", state.tab); state.focusQ = false; render(); scrollTo(0, 0);
});
view.addEventListener("click", e => {
  const c = e.target.closest("[data-chip]");
  if (c) { state[c.dataset.chip] = c.dataset.v; state.focusQ = false; render(); return; }
  if (e.target.id === "refresh") refresh();
});
view.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; state.focusQ = true; render(); }
});

async function refresh() {
  try {
    D = derive(await load());
    sub.textContent = "Kalyan, 25–26 November";
    render();
  } catch (err) {
    if (!D) {
      try { const c = JSON.parse(store.get("cache") || "null"); if (c && c.rooms) { D = derive(c); render(); } } catch {}
    }
    sub.textContent = D ? "Offline: showing the last saved copy" : "Couldn't load the sheet";
    if (!D) view.innerHTML = `<div class="card setup"><p class="warn-text">${esc(err.message)}</p><p>Check your internet and try again.</p><button class="btn primary" id="refresh">Try again</button></div>`;
  }
}

function setup() {
  view.innerHTML = `<div class="card setup">
    <p><b>Open this page from the link you were sent.</b> It carries the sheet address.</p>
    <p class="s">Setting up? Paste the Google Sheet's link (shared as "Anyone with the link → Viewer"):</p>
    <input type="url" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…">
    <button class="btn primary" id="go">Open</button></div>`;
  document.getElementById("go").onclick = () => {
    const m = document.getElementById("sheetUrl").value.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
    if (!m) { document.getElementById("sheetUrl").insertAdjacentHTML("afterend", `<p class="warn-text">That doesn't look like a Google Sheets link.</p>`); return; }
    location.search = "?sheet=" + m[1];
  };
}

if (!SHEET && !LOCAL) setup();
else {
  view.innerHTML = `<div class="empty">Loading…</div>`;
  refresh();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 120000);
}
</script>
</body>
</html>
